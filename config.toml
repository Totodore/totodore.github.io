# The URL the site will be built for
base_url = "https://totodore.github.io"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

title = "Théodore's blog"
author = "Théodore Prévot"
taxonomies = [{ name = "tags", feed = true }]

[markdown.highlighting]
# Syntax highlighting (Giallo). See https://github.com/getzola/giallo#built-in for theme names
theme = "ayu-dark"
error_on_missing_language = true

[extra.feather]
# Put all your custom variables here
hide_nav_image = true
cusdis_id = "fca7dcf2-c2fc-46fe-adfe-df1f1a7e5cc2"
social = { url = "https://github.com/totodore", display = "Github" }
